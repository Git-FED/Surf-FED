[package]
name = "surf-fed"
version = "0.1.0"
description = "Surf FED mobile browser workspace"
authors = ["Surf FED contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "surf_fed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0" }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
